name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: "ID del proyecto (carpeta en projects/)"
        required: true
        default: vasopresores
      quality:
        description: "draft = media resolución, rápido | final = completo, exige datos médicos revisados"
        type: choice
        options: [draft, final]
        default: draft

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias del sistema (ffmpeg + Chrome headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2t64

      - run: npm ci

      - name: Render + validación + QA
        env:
          PROJECT: ${{ inputs.project }}
          QUALITY: ${{ inputs.quality }}
        run: |
          if [ "$QUALITY" = "final" ]; then
            npx tsx scripts/render.ts "$PROJECT" --final
          else
            npx tsx scripts/render.ts "$PROJECT"
          fi

      - name: Subir MP4 y reporte QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-${{ inputs.quality }}
          path: |
            output/*.mp4
            output/*-qa.json
          if-no-files-found: warn
